name: Publish Motor City to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'Optional Actions run ID containing a successful Desktop WebGL artifact (empty = newest)'
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: motor-city-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare existing Desktop WebGL build
    runs-on: ubuntu-latest
    outputs:
      release_run_id: ${{ steps.find-run.outputs.run_id }}
    steps:
      - name: Select successful release build
        id: find-run
        uses: actions/github-script@v7
        env:
          REQUESTED_RUN_ID: ${{ inputs.release_run_id }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const artifactName = 'motor-city-webgl-desktop-release';
            const requested = process.env.REQUESTED_RUN_ID.trim();
            const ids = [];
            if (requested) {
              if (!/^\d+$/.test(requested)) core.setFailed('release_run_id must be numeric');
              ids.push(Number(requested));
            } else {
              const result = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: 'motor-city-source-gates.yml',
                status: 'success', per_page: 20
              });
              ids.push(...result.data.workflow_runs.map(run => run.id));
            }
            for (const run_id of ids) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner, repo, run_id, per_page: 100
              });
              if (result.data.artifacts.some(a => a.name === artifactName && !a.expired)) {
                core.setOutput('run_id', String(run_id));
                core.info(`Using Desktop release artifact from run ${run_id}`);
                return;
              }
            }
            core.setFailed('No unexpired Desktop WebGL artifact found. Run Motor City Source Gates with build_webgl_release enabled.');

      - name: Checkout release preparation script
        uses: actions/checkout@v4

      - name: Download Desktop WebGL release
        uses: actions/download-artifact@v4
        with:
          name: motor-city-webgl-desktop-release
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/desktop

      - name: Download Mobile WebGL release
        uses: actions/download-artifact@v4
        with:
          name: motor-city-webgl-mobile-release
          run-id: ${{ steps.find-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: downloads/mobile

      - name: Install Brotli for streaming WebGL decompression
        run: python3 -m pip install --disable-pip-version-check brotli==1.1.0

      - name: Prepare responsive Desktop and Mobile Pages site
        shell: bash
        run: |
          set -euo pipefail
          python3 Tools/prepare_pages_webgl.py \
            --desktop downloads/desktop \
            --mobile downloads/mobile \
            --output _site \
            --release-sha "${{ github.sha }}" \
            --release-run "${{ steps.find-run.outputs.run_id }}"
          test -f _site/desktop/index.html
          test -f _site/mobile/index.html

      - name: Upload GitHub Pages content
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
