name: Motor City Source Gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motor-city-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-gates:
    name: Static, GUID and C# source gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Phase 0/1 static gates
        run: python3 Tools/check_phase_0_1.py

      - name: Check Phase 3 vehicle prefab and wheel contract
        run: python3 Tools/check_vehicle_contract.py

      - name: Audit Phase 3 vehicle importers and Hybrid body
        run: python3 Tools/check_vehicle_importers.py

      - name: Validate Phase 4 authored material role manifest
        run: python3 Tools/check_phase4_material_roles.py

      - name: Audit Phase 5 safe cleanup and protected materials
        run: python3 Tools/check_phase5_cleanup.py

      - name: Audit Phase 6 bootstrap and runtime lifecycle
        run: python3 Tools/check_phase6_lifecycle.py

      - name: Audit Phase 7 UI layout ownership
        run: python3 Tools/check_phase7_ui_ownership.py

      - name: Run Roslyn syntax and regression checks
        shell: pwsh
        run: ./Tools/check_cleanup.ps1

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-city-static-audit
          path: Temp/MotorCityAudit/static-audit.json
          if-no-files-found: warn
          retention-days: 14

  ui-layout:
    name: UI source layout gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run UI layout source checks
        shell: pwsh
        run: ./Tools/check_ui_layout.ps1

  unity-editor:
    name: Unity 6 Editor batch validation
    # Register a Windows self-hosted runner with Unity 6000.6.1f1 installed,
    # activated for CI use under a valid license. No credentials go in Git.
    # The job is skipped until repository variable UNITY_CI_ENABLED is 'true'.
    if: ${{ vars.UNITY_CI_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, X64, unity6000]
    timeout-minutes: 60
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Unity project in batch mode
        shell: pwsh
        env:
          MOTORCITY_PHASE3_REBUILD: ${{ (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[phase3-full-check]')) && '1' || '0' }}
        run: ./Tools/run_unity_phase2.ps1

      - name: Upload Unity validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-city-unity-validation
          path: Temp/MotorCityAudit/UnityPhase2/
          if-no-files-found: warn
          retention-days: 14

  unity-webgl:
    name: Unity 6 WebGL build and report
    # Run only via Actions -> Run workflow with UNITY_WEBGL_CI_ENABLED=true.
    if: ${{ (github.event_name == 'workflow_dispatch' || (contains(github.event.head_commit.message, '[phase3-full-check]') || contains(github.event.head_commit.message, '[phase4-full-check]'))) && vars.UNITY_WEBGL_CI_ENABLED == 'true' && vars.UNITY_CI_ENABLED == 'true' }}
    runs-on: [self-hosted, Windows, X64, unity6000]
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Build WebGL in Unity batch mode
        shell: pwsh
        run: ./Tools/run_unity_phase2.ps1 -BuildWebGL

      - name: Upload WebGL build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-city-webgl-build-report
          path: |
            Temp/MotorCityAudit/UnityPhase2/unity-batch.log
            Temp/MotorCityAudit/UnityPhase2/unity-compile.txt
            Temp/MotorCityAudit/UnityPhase2/unity-dependencies.txt
            Temp/MotorCityAudit/UnityPhase2/unity-build.txt
          if-no-files-found: warn
          retention-days: 14
