name: Prepare Motor City Tabler Sprites

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: motor-city-tabler-sprites
  cancel-in-progress: false

jobs:
  export:
    name: Convert selected SVG icons to Unity sprites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout game repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install SVG renderer
        run: python3 -m pip install --disable-pip-version-check cairosvg==2.7.1

      - name: Verify checked-in SVG filenames and license
        run: python3 Tools/export_tabler_ui_icons.py --check

      - name: Export white transparent Tabler sprites
        run: python3 Tools/export_tabler_ui_icons.py

      - name: Commit generated sprites
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/Resources/MotorCity/UI/Icons/Tabler/
          if git diff --cached --quiet; then
            echo "PNG sprites are already up to date"
            exit 0
          fi
          git commit -m "assets(ui): generate curated Tabler PNG sprites"
          git push origin HEAD:main
