name: Motor City Deep Audit

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Build Unity dependency audit
        shell: bash
        run: |
          python3 - <<'PY'
          import os, re, json, hashlib, collections

          ROOT=os.getcwd()
          GUID_RE=re.compile(r'\bguid:\s*([0-9a-fA-F]{32})\b')
          CLASS_RE=re.compile(r'\b(?:class|struct|interface)\s+([A-Za-z_][A-Za-z0-9_]*)')
          TEXT_EXTS={
              '.prefab','.unity','.mat','.asset','.controller','.anim','.overridecontroller',
              '.shader','.shadergraph','.hlsl','.cginc','.asmdef','.json','.txt','.md',
              '.cs','.meta','.lighting','.physicmaterial','.rsp','.jslib','.po','.gitattributes',
              '.gitignore','.yml','.yaml'
          }

          def norm(p): return p.replace('\\','/')
          def is_text_path(p):
              ext=os.path.splitext(p)[1].lower()
              return ext in TEXT_EXTS or os.path.basename(p) in {'.gitignore','.gitattributes'}

          files=[]
          for base, dirs, names in os.walk(ROOT):
              relbase=norm(os.path.relpath(base, ROOT))
              if relbase=='.git' or relbase.startswith('.git/'):
                  dirs[:] = []
                  continue
              dirs[:] = [d for d in dirs if d != '.git']
              for n in names:
                  p=norm(os.path.join(relbase,n))
                  if p.startswith('./'): p=p[2:]
                  try: size=os.path.getsize(os.path.join(ROOT,p))
                  except OSError: size=0
                  files.append((p,size))

          path_set={p for p,_ in files}
          sizes=dict(files)

          meta_guid={}
          guid_asset={}
          for p,_ in files:
              if not p.endswith('.meta'): continue
              try:
                  text=open(os.path.join(ROOT,p),'r',encoding='utf-8',errors='ignore').read(4096)
              except Exception:
                  continue
              m=re.search(r'^guid:\s*([0-9a-fA-F]{32})\s*$',text,re.M)
              if not m: continue
              g=m.group(1).lower()
              asset=p[:-5]
              meta_guid[asset]=g
              guid_asset[g]=asset

          refs={}
          missing_refs=collections.defaultdict(set)
          guid_ref_sources=collections.defaultdict(set)
          for p,_ in files:
              if not is_text_path(p) or p.endswith('.meta'): continue
              try:
                  text=open(os.path.join(ROOT,p),'r',encoding='utf-8',errors='ignore').read()
              except Exception:
                  continue
              gs={g.lower() for g in GUID_RE.findall(text)}
              dep=set()
              for g in gs:
                  if g in {'00000000000000000000000000000000'}: continue
                  guid_ref_sources[g].add(p)
                  a=guid_asset.get(g)
                  if a:
                      dep.add(a)
                  else:
                      missing_refs[p].add(g)
              refs[p]=dep

          roots=set()
          # Build scenes from EditorBuildSettings
          ebs='ProjectSettings/EditorBuildSettings.asset'
          if ebs in path_set:
              text=open(os.path.join(ROOT,ebs),'r',encoding='utf-8',errors='ignore').read()
              roots.update(re.findall(r'^\s*path:\s*(Assets/.*?\.unity)\s*$',text,re.M))
          # Everything under Resources is a runtime root.
          for p,_ in files:
              if p.startswith('Assets/Resources/') and not p.endswith('.meta'):
                  roots.add(p)
              if p.startswith('Assets/Plugins/') and not p.endswith('.meta'):
                  roots.add(p)

          # Tracked authoring sources that must remain rebuildable even though
          # they are not shipped as runtime scenes.
          for authoring_root in (
              'Assets/LocalGenerated/FCG_Workbench.unity',
              'Assets/MotorCity/VehiclePrototypes/Hybrid/HybridVisual.prefab',
              'Assets/MotorCity/VehiclePrototypes/Hybrid/HybridPhysicsPrototype.prefab'
          ):
              if authoring_root in path_set:
                  roots.add(authoring_root)
          # Project settings can hold asset GUID roots.
          project_setting_deps=set()
          for p,_ in files:
              if p.startswith('ProjectSettings/') and is_text_path(p):
                  roots.add(p)
                  project_setting_deps.update(refs.get(p,set()))

          reachable=set()
          queue=collections.deque(roots | project_setting_deps)
          while queue:
              p=queue.popleft()
              if p in reachable: continue
              reachable.add(p)
              for d in refs.get(p,()):
                  if d not in reachable: queue.append(d)

          # Script inventory and rough static reference counts.
          cs_paths=[p for p,_ in files if p.endswith('.cs')]
          cs_text={}
          all_cs=''
          for p in cs_paths:
              try: t=open(os.path.join(ROOT,p),'r',encoding='utf-8',errors='ignore').read()
              except Exception: t=''
              cs_text[p]=t
              all_cs+='\n'+t
          script_defs=[]
          for p,t in cs_text.items():
              g=meta_guid.get(p)
              serialized_refs=len(guid_ref_sources.get(g,set())) if g else 0
              attrs=('RuntimeInitializeOnLoadMethod' in t or 'InitializeOnLoad' in t or
                     'InitializeOnLoadMethod' in t or 'MenuItem(' in t or
                     'AssetPostprocessor' in t)
              for name in CLASS_RE.findall(t):
                  occurrences=len(re.findall(r'\b'+re.escape(name)+r'\b',all_cs))
                  script_defs.append({
                      'path':p,'type':name,'code_occurrences':occurrences,
                      'serialized_ref_sources':serialized_refs,
                      'has_editor_or_runtime_attribute':attrs
                  })

          # Aggregate reachability by major folder.
          def topfolder(p):
              parts=p.split('/')
              if len(parts)>=2 and parts[0]=='Assets':
                  return '/'.join(parts[:2])
              return parts[0]

          groups=collections.defaultdict(lambda:{'files':0,'bytes':0,'reachable_files':0,'reachable_bytes':0,'unreachable_files':0,'unreachable_bytes':0})
          for p,size in files:
              if p.endswith('.meta'): continue
              key=topfolder(p)
              g=groups[key]
              g['files']+=1; g['bytes']+=size
              if p in reachable:
                  g['reachable_files']+=1; g['reachable_bytes']+=size
              else:
                  g['unreachable_files']+=1; g['unreachable_bytes']+=size

          # Unbuilt scenes.
          built={p for p in roots if p.endswith('.unity')}
          scenes=[{'path':p,'size':sizes[p],'built':p in built,'reachable':p in reachable}
                  for p,_ in files if p.endswith('.unity')]

          # Large files.
          largest=sorted(
              ({'path':p,'size':s,'reachable':p in reachable} for p,s in files if not p.endswith('.meta')),
              key=lambda x:x['size'], reverse=True)[:300]

          # Assets in Resources that are suspiciously stale by name.
          stale_name_re=re.compile(r'(beatall|tristar|doclorean|stuttgart|tois08|toro86|musclecar|multiplx|smarty)',re.I)
          stale_named=[p for p,_ in files if stale_name_re.search(p)]

          # Text duplicates based on full content; binary LFS pointer duplicates are skipped.
          hashes=collections.defaultdict(list)
          for p,size in files:
              if size==0 or size>5_000_000 or not is_text_path(p) or p.endswith('.meta'): continue
              try:
                  data=open(os.path.join(ROOT,p),'rb').read()
              except Exception:
                  continue
              h=hashlib.sha256(data).hexdigest()
              hashes[(h,len(data))].append(p)
          duplicates=[
              {'size':size,'paths':ps}
              for (h,size),ps in hashes.items() if len(ps)>1 and size>256
          ]
          duplicates.sort(key=lambda x:x['size']*(len(x['paths'])-1), reverse=True)

          # Missing asset references only (filter Unity built-in/package GUIDs later by caller).
          missing=[{'source':p,'guids':sorted(gs)} for p,gs in missing_refs.items()]

          # Candidate unreachable package folders: no reachable asset bytes and no path mention in MotorCity scripts/editor.
          core_code='\n'.join(t for p,t in cs_text.items() if p.startswith('Assets/Scripts/') or p.startswith('Assets/Editor/'))
          package_candidates=[]
          for key,g in sorted(groups.items()):
              if not key.startswith('Assets/'): continue
              if key in {'Assets/Scripts','Assets/Editor','Assets/Resources','Assets/Settings','Assets/Scenes','Assets/MotorCity','Assets/Art','Assets/Shaders','Assets/Plugins'}:
                  continue
              short=key.split('/',1)[1]
              mentioned=short.lower() in core_code.lower()
              package_candidates.append({'folder':key,**g,'mentioned_in_core_code':mentioned})

          report={
              'file_count':len(files),
              'asset_guid_count':len(guid_asset),
              'root_count':len(roots),
              'reachable_count':len(reachable),
              'reachable_paths':sorted(reachable),
              'roots':sorted(roots),
              'groups':dict(sorted(groups.items())),
              'scenes':scenes,
              'largest_files':largest,
              'stale_named_paths':stale_named,
              'missing_guid_refs':missing,
              'script_defs':script_defs,
              'code_asset_paths':sorted(set(re.findall(r'Assets/[A-Za-z0-9_ .()&+\\/-]+(?:\\.[A-Za-z0-9]+)?', core_code))),
              'duplicates':duplicates[:300],
              'package_candidates':package_candidates
          }
          os.makedirs('AuditOutput',exist_ok=True)
          with open('AuditOutput/audit_report.json','w',encoding='utf-8') as f:
              json.dump(report,f,ensure_ascii=False,indent=2)
          with open('AuditOutput/summary.txt','w',encoding='utf-8') as f:
              f.write(f"Files: {len(files)}\nAssets with GUID: {len(guid_asset)}\nRuntime roots: {len(roots)}\nReachable: {len(reachable)}\n")
              f.write("\nPACKAGE CANDIDATES\n")
              for x in package_candidates:
                  f.write(json.dumps(x,ensure_ascii=False)+"\n")
              f.write("\nSCENES\n")
              for x in scenes:
                  f.write(json.dumps(x,ensure_ascii=False)+"\n")
              f.write("\nSTALE NAMES\n")
              for x in stale_named:
                  f.write(x+"\n")
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: motor-city-deep-audit
          path: AuditOutput/
          retention-days: 1
